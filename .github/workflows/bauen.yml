# EulenSlicer für Windows bauen, als MSI packen, signieren, ins Portal laden und als
# GitHub-Release veröffentlichen.
#
# Läuft
#  - von Hand: Actions → „EulenSlicer bauen“ → Run workflow (mit „freigeben“ und „Was ist neu?“),
#  - bei einem Tag „v…“ (wird gleich freigegeben),
#  - bei jedem Push auf main, außer wenn sich nur Doku, Tests oder andere Workflows ändern
#    (wird hochgeladen, aber zurückgezogen – im Portal zum Testen freigeben),
#  - von „OrcaSlicer-Update“ nach dem automatischen Zusammenführen (ebenfalls zurückgezogen;
#    das Ergebnis steht danach als Kommentar im Pull Request),
#  - bei Pull Requests: nur bauen (MSI unter Artifacts), nichts ins Portal, kein Release.
#    Pull Requests laufen immer bei GitHub (windows-latest), nie auf dem eigenen Runner.
#
# GitHub-Release (für das HPG-Softwarecenter, „hpgsc sync“ liest das neueste Release):
# Jede MSI, die ins Portal geht, kommt zusätzlich als Release „v<MSI-Version>“ (z. B. v2.4.23)
# mit dem Asset „EulenSlicer-<MSI-Version>.msi“ – dieselbe Datei wie im Portal, als „Latest“.
# Nur wenn Bauen und „Prüfen“ grün sind. Gibt es den Tag schon oder ist die Version nicht
# höher als das neueste Release, bricht der Lauf vor dem Upload ins Portal ab.
# Den Tag legt das Release mit GITHUB_TOKEN an – das startet diesen Workflow nicht noch einmal
# (mit einem eigenen Token statt GITHUB_TOKEN gäbe es über „tags: v*“ eine Schleife).
#
# Braucht unter Settings → Secrets and variables → Actions (Werte im Portal unter
# 3 Eulen → EulenSlicer → GitHub):
#   Variablen: PORTAL_API, UPDATE_PUBKEY (optional BUILD_OFFSET)
#   Secrets:   PORTAL_ZUGANG, SIGNATUR_SCHLUESSEL
#
# Läuft auf dem eigenen Windows-Runner (self-hosted, Windows, X64); mit der Variable
# EULEN_RUNNER = github wieder auf windows-latest bei GitHub. Der erste Lauf baut die
# Abhängigkeiten von OrcaSlicer und hebt sie auf – bei GitHub im Zwischenspeicher, auf dem
# eigenen Runner auf seiner Platte (skripte/abhaengigkeiten.ps1). Auf dem eigenen Runner dauert
# der erste Lauf knapp eine Stunde, danach gut eine halbe (bei GitHub gut 2,5 bzw. 1,25 Stunden).
name: EulenSlicer bauen

on:
  workflow_dispatch:
    inputs:
      freigeben:
        description: "Gleich für alle freigeben (sonst im Portal zurückgezogen, zum Testen)"
        type: boolean
        default: true
      notizen:
        description: "Was ist neu? (erscheint im Slicer und im Portal)"
        type: string
        default: ""
      nur_bauen:
        description: "Nur bauen (Test): MSI unter Artifacts, nichts ins Portal – geht auch ohne Secrets"
        type: boolean
        default: false
      pr:
        description: "Pull Request für die Rückmeldung (setzt „OrcaSlicer-Update“, sonst leer lassen)"
        type: string
        default: ""
  push:
    tags: ["v*"]
    branches: [main]
    # Gilt nur für main (bei Tags wertet GitHub keine Pfade aus). Ein „!“ nimmt aus,
    # eine spätere Zeile ohne „!“ nimmt wieder auf.
    paths:
      - "**"
      - "!README.md"
      - "!LICENSE.txt"
      - "!.gitignore"
      - "!tests/**"
      - "!bilder/vorschau/**"
      - "!.github/**"
      - ".github/workflows/bauen.yml"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!README.md"
      - "!LICENSE.txt"
      - "!.gitignore"
      - "!tests/**"
      - "!bilder/vorschau/**"
      - "!.github/**"
      - ".github/workflows/bauen.yml"

# Pull Requests in eigener Gruppe: Sonst würde ein wartender Pull-Request-Lauf einen
# wartenden Lauf für main (mit Release) verdrängen.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('eulenslicer-bauen-pr-{0}', github.event.pull_request.number) || 'eulenslicer-bauen' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bauen:
    name: Windows x64
    # Bei Pushes nur, wenn GitHub schon eingerichtet ist (sonst gäbe jeder Push einen roten Lauf).
    if: github.event_name != 'push' || vars.PORTAL_API != ''
    # Pull Requests nie auf dem eigenen Runner (das Repo ist öffentlich, siehe README → Sicherheit).
    runs-on: ${{ (github.event_name == 'pull_request' || vars.EULEN_RUNNER == 'github') && 'windows-latest' || fromJSON('["self-hosted", "Windows", "X64"]') }}
    # Bei GitHub ist nach 6 Stunden Schluss; der eigene Runner darf beim ersten Mal länger.
    timeout-minutes: ${{ (github.event_name == 'pull_request' || vars.EULEN_RUNNER == 'github') && 355 || 720 }}
    env:
      PORTAL_API: ${{ vars.PORTAL_API }}
      UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
      # Pull Request oder „Nur bauen“: MSI nur unter Artifacts, nichts ins Portal, kein Release.
      NUR_BAUEN: ${{ github.event_name == 'pull_request' || inputs.nur_bauen == true }}
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.msi.outputs.version }}
      msi_name: ${{ steps.msi.outputs.name }}
      sha256: ${{ steps.msi.outputs.sha256 }}
    steps:
      - name: EulenSlicer-Repo holen
        uses: actions/checkout@v6
        with:
          path: eulen

      - name: Eigener Runner – ist alles installiert?
        if: runner.environment == 'self-hosted'
        # cmd und Windows PowerShell 5.1: meldet auch ein fehlendes PowerShell 7.
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File eulen\skripte\runner-pruefen.ps1 -Fuer bauen || exit /b 1
          rem Der eigene Runner behält den Arbeitsordner: alte MSIs weg (eulen\ und orca\ räumt checkout auf).
          del /q EulenSlicer-* 2>nul
          exit /b 0

      - name: Einstellungen prüfen
        shell: pwsh
        env:
          PORTAL_ZUGANG: ${{ secrets.PORTAL_ZUGANG }}
          SIGNATUR_SCHLUESSEL: ${{ secrets.SIGNATUR_SCHLUESSEL }}
        run: |
          $fehlt = @()
          if (-not $env:PORTAL_API) { $fehlt += 'Variable PORTAL_API' }
          if (-not $env:UPDATE_PUBKEY) { $fehlt += 'Variable UPDATE_PUBKEY' }
          if (-not $env:PORTAL_ZUGANG) { $fehlt += 'Secret PORTAL_ZUGANG' }
          if (-not $env:SIGNATUR_SCHLUESSEL) { $fehlt += 'Secret SIGNATUR_SCHLUESSEL' }
          if ($fehlt.Count -gt 0) {
            if ($env:NUR_BAUEN -eq 'true') {
              Write-Output "::warning::Nur bauen: Es fehlt $($fehlt -join ', '). Die MSI taugt zum Testen, sucht aber ohne PORTAL_API/UPDATE_PUBKEY keine Updates."
            } else {
              Write-Output "::error::Es fehlt unter Settings → Secrets and variables → Actions: $($fehlt -join ', '). Die Werte stehen im Portal unter 3 Eulen → EulenSlicer → GitHub."
              exit 1
            }
          }

      - name: Version und Build-Nummer
        id: orca
        shell: pwsh
        run: |
          $tag = (Get-Content eulen/orca.version -Raw).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { Write-Output "::error::orca.version enthält keinen Tag wie v2.4.2: '$tag'"; exit 1 }
          $offset = 0
          if ("${{ vars.BUILD_OFFSET }}" -match '^\d+$') { $offset = [int]"${{ vars.BUILD_OFFSET }}" }
          $build = [int]"${{ github.run_number }}" + $offset
          "tag=$tag" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          "EULEN_BUILD=$build" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Output "OrcaSlicer $tag, Build $build"

      - name: OrcaSlicer holen
        uses: actions/checkout@v6
        with:
          repository: OrcaSlicer/OrcaSlicer
          ref: ${{ steps.orca.outputs.tag }}
          path: orca
          lfs: false
          fetch-depth: 1

      - name: Anpassungen des EulenSlicers anwenden
        id: anpassen
        shell: pwsh
        run: |
          # Pillow färbt die PNG-Bilder der Seiten von Türkis zu Blau um.
          python -m pip install --disable-pip-version-check --quiet pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python eulen/skripte/anwenden.py --orca orca

      - name: Abhängigkeiten aus dem Zwischenspeicher
        id: deps
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v5
        with:
          path: orca/deps/build/OrcaSlicer_dep
          key: eulen-windows-x64-deps-${{ hashFiles('orca/deps/**') }}

      - name: Abhängigkeiten vom eigenen Runner
        id: lager
        if: runner.environment == 'self-hosted'
        shell: pwsh
        env:
          DEPS_HASH: ${{ hashFiles('orca/deps/**') }}
        run: |
          "hash=$env:DEPS_HASH" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          pwsh eulen/skripte/abhaengigkeiten.ps1 -Holen -Hash $env:DEPS_HASH -Ziel orca/deps/build/OrcaSlicer_dep

      - name: CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          # Auf dem eigenen Runner im Werkzeug-Ordner statt im Zwischenspeicher von GitHub: dessen
          # tar scheitert dort am tar aus Git (Warnung „Failed to save“).
          useCloudCache: ${{ runner.environment == 'github-hosted' }}
          useLocalCache: ${{ runner.environment == 'self-hosted' }}

      - name: MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Abhängigkeiten bauen (nur beim ersten Mal oder nach einem OrcaSlicer-Update)
        if: steps.deps.outputs.cache-hit != 'true' && steps.lager.outputs.da != 'true'
        working-directory: orca
        shell: pwsh
        run: |
          # OpenSSL braucht Strawberry Perl; auf dem eigenen Runner ist es schon installiert.
          if ('${{ runner.environment }}' -eq 'github-hosted') { choco install strawberryperl -y --no-progress }
          .\build_release_vs.bat deps
          if (-not (Test-Path deps/build/OrcaSlicer_dep)) { Write-Output "::error::Die Abhängigkeiten wurden nicht gebaut."; exit 1 }

      - name: Abhängigkeiten in den Zwischenspeicher
        if: runner.environment == 'github-hosted' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: orca/deps/build/OrcaSlicer_dep
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Abhängigkeiten auf dem eigenen Runner aufheben
        if: runner.environment == 'self-hosted' && steps.lager.outputs.da != 'true'
        shell: pwsh
        run: pwsh eulen/skripte/abhaengigkeiten.ps1 -Ablegen -Hash '${{ steps.lager.outputs.hash }}' -Quelle orca/deps/build/OrcaSlicer_dep

      - name: EulenSlicer bauen
        working-directory: orca
        shell: pwsh
        run: |
          .\build_release_vs.bat slicer
          if (-not (Test-Path build/OrcaSlicer/orca-slicer.exe)) { Write-Output "::error::orca-slicer.exe fehlt nach dem Bauen."; exit 1 }

      - name: Programmordner aufheben (3 Tage, für „MSI neu packen“)
        shell: pwsh
        run: |
          @{ orca_version = '${{ steps.anpassen.outputs.orca_version }}'; build = [int]$env:EULEN_BUILD } |
            ConvertTo-Json | Out-File -FilePath orca/build/eulen-build.json -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: EulenSlicer-Programm-b${{ env.EULEN_BUILD }}
          path: |
            orca/build/OrcaSlicer
            orca/build/eulen-build.json
          retention-days: 3

      - name: MSI bauen
        shell: pwsh
        run: pwsh eulen/skripte/msi.ps1 -Quelle orca/build/OrcaSlicer -Version '${{ steps.anpassen.outputs.orca_version }}' -Build $env:EULEN_BUILD

      - name: MSI prüfen (Version, UpgradeCode, pro Maschine, Major Upgrade)
        id: msi
        shell: pwsh
        # Windows PowerShell 5.1: dort ist der COM-Zugriff auf Windows Installer erprobt.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eulen\skripte\msi-pruefen.ps1 -Msi $env:MSI -Version $env:MSI_VERSION

      - name: MSI aufheben (14 Tage unter „Artifacts“)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MSI_NAME }}
          path: ${{ env.MSI }}
          retention-days: 14

      # Vor dem Portal: Gibt es den Tag schon oder ist die Version nicht höher als das neueste
      # Release, hört der Lauf hier auf – sonst stünde im Portal etwas, das es auf GitHub nicht gibt.
      - name: GitHub-Release vorbereiten (Tag frei, Version höher?)
        id: release
        if: env.NUR_BAUEN != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.msi.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $kopf = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }

          $null = Invoke-RestMethod "$api/git/ref/tags/$tag" -Headers $kopf -SkipHttpErrorCheck -StatusCodeVariable status
          if ($status -eq 200) { Write-Output "::error::Den Tag $tag gibt es schon. Er wird nicht überschrieben - Lauf abgebrochen (nichts ins Portal)."; exit 1 }
          if ($status -ne 404) { Write-Output "::error::Tag $tag ließ sich nicht prüfen (HTTP $status)."; exit 1 }

          $neuestes = Invoke-RestMethod "$api/releases/latest" -Headers $kopf -SkipHttpErrorCheck -StatusCodeVariable status
          if ($status -eq 200) {
            if ($neuestes.tag_name -match '^v(\d+\.\d+\.\d+)$') {
              if ([version]$env:VERSION -le [version]$Matches[1]) {
                Write-Output "::error::Version $env:VERSION ist nicht höher als das neueste Release $($neuestes.tag_name) (BUILD_OFFSET oder orca.version gesenkt?). Lauf abgebrochen (nichts ins Portal)."
                exit 1
              }
            } else {
              Write-Output "::warning::Das neueste Release heißt $($neuestes.tag_name) - nicht v<Major.Minor.Build>, Vergleich übersprungen."
            }
          } elseif ($status -ne 404) {
            Write-Output "::error::Das neueste Release ließ sich nicht lesen (HTTP $status)."; exit 1
          }
          "release=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Output "GitHub-Release $tag folgt nach dem Upload ins Portal, wenn auch Prüfen grün ist."

      - name: Ins Portal hochladen
        if: env.NUR_BAUEN != 'true'
        shell: pwsh
        env:
          PORTAL_ZUGANG: ${{ secrets.PORTAL_ZUGANG }}
          SIGNATUR_SCHLUESSEL: ${{ secrets.SIGNATUR_SCHLUESSEL }}
          FREIGEBEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.freigeben) || startsWith(github.ref, 'refs/tags/') }}
          # „Was ist neu?“ liest hochladen.py aus der Umgebung (keine Anführungszeichen-Probleme).
          NOTIZEN: ${{ inputs.notizen || github.event.head_commit.message }}
        run: |
          python -m pip install --disable-pip-version-check --quiet cryptography
          $argumente = @('eulen/skripte/hochladen.py', '--msi', $env:MSI, '--version', '${{ steps.anpassen.outputs.orca_version }}',
                         '--build', $env:EULEN_BUILD, '--orca', '${{ steps.anpassen.outputs.orca_version }}',
                         '--signatur-datei', "$env:MSI.sig")
          if ($env:FREIGEBEN -ne 'true') { $argumente += '--nicht-freigeben' }
          python @argumente
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Tests für das Release (bei Pull Requests läuft „Prüfen“ ohnehin selbst).
  pruefen:
    name: Prüfen
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/pruefen.yml

  release:
    name: GitHub-Release
    needs: [bauen, pruefen]
    # Ohne always() nur, wenn bauen und pruefen beide erfolgreich waren.
    if: needs.bauen.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: MSI aus diesem Lauf holen
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.bauen.outputs.msi_name }}
          path: artefakt

      - name: Release v${{ needs.bauen.outputs.version }} anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bauen.outputs.version }}
          SHA256: ${{ needs.bauen.outputs.sha256 }}
          # Dasselbe „Was ist neu?“ wie im Portal, vor den automatisch erzeugten Notizen.
          NOTIZEN: ${{ inputs.notizen || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          asset="EulenSlicer-$VERSION.msi"

          shopt -s nullglob
          msis=(artefakt/*.msi)
          if [ "${#msis[@]}" -ne 1 ]; then echo "::error::Im Artefakt liegen ${#msis[@]} MSI-Dateien statt einer."; exit 1; fi
          cp "${msis[0]}" "$asset"
          ist=$(sha256sum "$asset" | cut -d' ' -f1)
          if [ "$ist" != "$SHA256" ]; then echo "::error::SHA-256 der MSI ($ist) passt nicht zu der im Portal ($SHA256)."; exit 1; fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          if [ "$status" = "200" ]; then echo "::error::Den Tag $tag gibt es schon – er wird nicht überschrieben."; exit 1; fi
          if [ "$status" != "404" ]; then echo "::error::Tag $tag ließ sich nicht prüfen (HTTP $status)."; exit 1; fi

          printf '%s\n' "$NOTIZEN" > notizen.md
          gh release create "$tag" "$asset" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EulenSlicer $VERSION" \
            --notes-file notizen.md \
            --generate-notes \
            --latest
          echo "Release $tag mit $asset: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"

  melden:
    name: Rückmeldung an den Pull Request
    needs: bauen
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Kommentar
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          ERGEBNIS: ${{ needs.bauen.result }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then echo "::error::pr muss eine Nummer sein: '$PR'"; exit 1; fi
          case "$ERGEBNIS" in
            success)
              text="✅ [„EulenSlicer bauen“]($LAUF) ist fertig. Die neue Version liegt **zurückgezogen** im Portal: auf einem Rechner installieren und testen, dann unter 3 Eulen → EulenSlicer → Versionen freigeben. Erst dann holen sich die Slicer das Update." ;;
            cancelled)
              text="⏹️ [„EulenSlicer bauen“]($LAUF) wurde abgebrochen. Neu starten: Actions → EulenSlicer bauen → Run workflow (ohne „freigeben“)." ;;
            *)
              text="❌ [„EulenSlicer bauen“]($LAUF) ist fehlgeschlagen – im Portal ist keine neue Version. Einzelheiten im Lauf; nach der Korrektur neu starten: Actions → EulenSlicer bauen → Run workflow (ohne „freigeben“)." ;;
          esac
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$text"
