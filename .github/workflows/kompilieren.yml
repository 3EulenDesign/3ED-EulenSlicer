# Schneller Kompilier-Check auf Windows: übersetzt nur die Dateien, die der
# EulenSlicer ändert oder neu bringt (quellen/*.cpp und die .cpp-Dateien aus
# skripte/anwenden.py) – ohne den Rest von OrcaSlicer zu bauen und ohne Linken.
# Dauert etwa eine Viertelstunde statt anderthalb Stunden.
#
# Braucht die Abhängigkeiten, die „EulenSlicer bauen“ aufhebt: auf dem eigenen Runner auf
# seiner Platte, bei GitHub (Variable EULEN_RUNNER = github) im Zwischenspeicher.
name: Kompilieren

on:
  workflow_dispatch:
  push:
    paths:
      - "quellen/**"
      - "skripte/anwenden.py"
      - ".github/workflows/kompilieren.yml"

concurrency:
  group: eulenslicer-kompilieren-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kompilieren:
    name: Windows x64 (nur geänderte Dateien)
    runs-on: ${{ vars.EULEN_RUNNER == 'github' && 'windows-latest' || fromJSON('["self-hosted", "Windows", "X64"]') }}
    timeout-minutes: 90
    env:
      PORTAL_API: ${{ vars.PORTAL_API }}
      UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
      EULEN_BUILD: "1"
    steps:
      - name: EulenSlicer-Repo holen
        uses: actions/checkout@v6
        with:
          path: eulen

      - name: Eigener Runner – ist alles installiert?
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: pwsh eulen/skripte/runner-pruefen.ps1 -Fuer kompilieren

      - name: Version von OrcaSlicer
        id: orca
        shell: pwsh
        run: |
          $tag = (Get-Content eulen/orca.version -Raw).Trim()
          "tag=$tag" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: OrcaSlicer holen
        uses: actions/checkout@v6
        with:
          repository: OrcaSlicer/OrcaSlicer
          ref: ${{ steps.orca.outputs.tag }}
          path: orca
          lfs: false
          fetch-depth: 1

      - name: Anpassungen anwenden
        shell: pwsh
        run: python eulen/skripte/anwenden.py --orca orca

      - name: Abhängigkeiten aus dem Zwischenspeicher
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v5
        with:
          path: orca/deps/build/OrcaSlicer_dep
          key: eulen-windows-x64-deps-${{ hashFiles('orca/deps/**') }}
          fail-on-cache-miss: true

      - name: Abhängigkeiten vom eigenen Runner
        id: lager
        if: runner.environment == 'self-hosted'
        shell: pwsh
        env:
          DEPS_HASH: ${{ hashFiles('orca/deps/**') }}
        run: |
          # Kein Kopieren nötig: CMake bekommt den Ordner auf dem Runner direkt (DEP_BUILD_DIR).
          pwsh eulen/skripte/abhaengigkeiten.ps1 -Ordner -Hash $env:DEPS_HASH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $env:GITHUB_OUTPUT -Pattern '^da=true' -Quiet)) {
            # Keine typografischen Anführungszeichen: PowerShell hält sie für echte.
            Write-Output "::error::Auf diesem Runner liegen noch keine Abhängigkeiten für diese OrcaSlicer-Version. Einmal Actions → EulenSlicer bauen laufen lassen (geht auch mit Nur bauen), danach klappt Kompilieren."
            exit 1
          }

      - name: CMake und Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"

      - name: MSVC-Umgebung
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake einrichten (Ninja)
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          # OrcaSlicer sucht die Abhängigkeiten sonst unter deps/<Name des Build-Ordners>.
          $deps = if ('${{ steps.lager.outputs.ordner }}') { '${{ steps.lager.outputs.ordner }}' } else { (Resolve-Path orca/deps/build).Path }
          $deps = $deps -replace '\\', '/'
          cmake -S orca -B orca/build-check -G Ninja -DCMAKE_BUILD_TYPE=Release -DORCA_TOOLS=OFF "-DDEP_BUILD_DIR=$deps"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Geänderte Dateien übersetzen
        shell: pwsh
        run: |
          $dateien = python eulen/skripte/anwenden.py --orca orca --dateien
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $alle = ninja -C orca/build-check -t targets all | ForEach-Object { ($_ -split ':')[0] }
          $ziele = @()
          foreach ($datei in $dateien) {
            $rel = $datei -replace '^src/(libslic3r|slic3r)/', ''
            $treffer = $alle | Where-Object { $_ -like "*.dir/$rel.obj" -and $_ -like "src/*" }
            if (-not $treffer) { Write-Output "::warning::Kein Ziel für $datei gefunden."; continue }
            $ziele += $treffer
          }
          $ziele = $ziele | Sort-Object -Unique
          Write-Output "Übersetze:"; $ziele | ForEach-Object { Write-Output "  $_" }
          ninja -C orca/build-check -k 0 @ziele
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Mindestens eine Datei lässt sich nicht übersetzen – siehe oben."; exit $LASTEXITCODE }
