# Schnelle Prüfung ohne Windows-Build (ein paar Minuten, Linux):
#  - Kern des Update-Kanals bauen und testen (SHA-256, Ed25519, Antwort des Portals),
#  - Kern der Portal-Verbindung testen (Adressen, Fehlertexte, Abgleich der Profile),
#  - Python-Skripte übersetzen, PowerShell-Skripte auf Syntaxfehler prüfen,
#  - passen alle Stellen von skripte/anwenden.py zur OrcaSlicer-Version in orca.version?
#  - ist der Installer gültiges XML?
# „OrcaSlicer-Update“ ruft es für den Zweig einer neuen OrcaSlicer-Version auf (workflow_call).
name: Prüfen

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Zweig, Tag oder Commit, der geprüft wird (leer = der auslösende)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: eulen
          ref: ${{ inputs.ref }}

      - name: Version von OrcaSlicer
        id: orca
        run: echo "tag=$(tr -d '[:space:]' < eulen/orca.version)" >> "$GITHUB_OUTPUT"

      - name: OrcaSlicer holen (nur Quelltext)
        uses: actions/checkout@v6
        with:
          repository: OrcaSlicer/OrcaSlicer
          ref: ${{ steps.orca.outputs.tag }}
          path: orca
          lfs: false
          fetch-depth: 1
          sparse-checkout: |
            src
            deps_src/nlohmann
            version.inc

      - name: Python-Skripte
        run: python3 -m py_compile eulen/skripte/anwenden.py eulen/skripte/hochladen.py

      - name: PowerShell-Skripte
        shell: pwsh
        run: |
          # Syntaxfehler und typografische Anführungszeichen außerhalb von Kommentaren: PowerShell
          # hält sie für echte und zerlegt die Zeichenkette still (Windows PowerShell 5.1 und 7).
          $typo = '[\u201C\u201D\u201E\u2018\u2019\u201A]'
          $fehler = 0
          foreach ($datei in Get-ChildItem eulen/skripte -Filter *.ps1) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($datei.FullName, [ref]$t, [ref]$e)
            $meldungen = @($e | ForEach-Object { @{ Zeile = $_.Extent.StartLineNumber; Text = $_.Message } })
            $meldungen += @($t | Where-Object { $_.Kind -ne 'Comment' -and $_.Extent.Text -match $typo } |
              ForEach-Object { @{ Zeile = $_.Extent.StartLineNumber; Text = 'Typografisches Anführungszeichen im Code (nur in Kommentaren erlaubt)' } })
            foreach ($m in $meldungen) { Write-Output "::error file=skripte/$($datei.Name),line=$($m.Zeile)::$($m.Text)"; $fehler++ }
            if (-not $meldungen) { Write-Output "$($datei.Name) ok" }
          }
          if ($fehler) { exit 1 }

      - name: Stellen in OrcaSlicer
        run: python3 eulen/skripte/anwenden.py --orca orca --pruefen

      - name: Kern des Update-Kanals testen
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -I eulen/quellen -I orca/deps_src \
            eulen/tests/kern_test.cpp eulen/quellen/EulenUpdaterKern.cpp -lcrypto -o kern_test
          ./kern_test

      - name: Kern der Portal-Verbindung testen
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I eulen/quellen -I orca/deps_src \
            eulen/tests/portal_test.cpp eulen/quellen/EulenPortalKern.cpp -o portal_test
          ./portal_test

      - name: Installer (XML)
        run: python3 -c "import xml.dom.minidom as m; m.parse('eulen/installer/EulenSlicer.wxs'); print('EulenSlicer.wxs ok')"
